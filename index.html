    <title>Mặt Trận Tổ Quốc Việt Nam Phường Bình Tiên</title>
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var _origFetch = window.fetch.bind(window);
            var _currentFetch = _origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return _currentFetch; },
              set: function(fn) { _currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Could not define custom fetch descriptor', e);
        }
      })();
    </script>
    <!-- Google Fonts for Administrative Dignity & Vietnamese Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- SheetJS for Excel (.xlsx, .xls) import -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Animation keyframes for Utility cards -->
    <style>
      @keyframes lacLuThe {
        0% { transform: scale(1) rotate(0deg); }
        20% { transform: scale(0.97) rotate(-3.5deg); }
        40% { transform: scale(1.02) rotate(3deg); }
        60% { transform: scale(0.99) rotate(-2deg); }
        80% { transform: scale(1.01) rotate(1deg); }
        100% { transform: scale(1) rotate(0deg); }
      }
      .animate-lac-lu {
        animation: lacLuThe 0.35s ease-in-out;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-red-900 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
